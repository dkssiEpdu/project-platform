<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>결 (GYEOL) | Independent Brand Archive</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Syne:wght@400;600;700;800&family=Gowun+Batang:wght@400;700&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Main Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <div id="splash-screen">
        <div class="splash-content">
            <div class="splash-eyebrow">Independent Brand Archive</div>
            <h1 class="splash-logo">결 (GYEOL)</h1>
            <div class="splash-sub">고유한 결을 기록하다</div>
            <div class="splash-loader"></div>
        </div>
    </div>

    <!-- Main App Container -->
    <div id="app">
        <header id="main-header">
            <div class="header-content">
                <h1 class="logo" id="logo-btn">결 (GYEOL)<span>ARCHIVE</span></h1>
                <div class="header-actions">
                    <div id="header-nav" style="display: flex; align-items: center; gap: 8px;">
                        <!-- Navigation menu buttons rendered dynamically -->
                    </div>
                </div>
            </div>
        </header>

        <main id="main-content">
            <div id="view-container">
                <!-- SPA views will be injected here -->
                <div class="loader-container">
                    <div class="loader"></div>
                </div>
            </div>
        </main>
        
        <footer>
            <div class="footer-inner">
                <div class="footer-logo">결 (GYEOL)</div>
                <p class="footer-copy">© 2026 GYEOL Archive — 독립 브랜드의 미학을 기록하는 아카이브 스토어</p>
            </div>
        </footer>
    </div>

    <!-- Product Detail Overlay Drawer Slider -->
    <div class="detail-slider-overlay" id="product-detail-overlay"></div>
    <div class="detail-slider-panel" id="product-detail-panel">
        <!-- Injected dynamically via Web Component -->
    </div>

    <!-- Floating Assistant -->
    <gyeol-chatbot></gyeol-chatbot>

    <!-- App Entry Module -->
    <script type="module" src="main.js"></script>
</body>
</html>
