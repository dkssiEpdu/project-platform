<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UniBridge | Community for International Students in Korea</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Main Font Awesome -->
    <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
    <!-- Fallback Font Awesome CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <div id="splash-screen">
        <div class="splash-content">
            <h1 class="splash-logo">UniBridge</h1>
            <div class="splash-loader"></div>
        </div>
    </div>
    <div id="app">
        <header id="main-header">
            <div class="header-content">
                <h1 class="logo">UniBridge</h1>
                <div class="header-actions">
                    <div id="header-nav" style="display: flex; align-items: center; gap: 12px;">
                        <!-- Header navigation buttons will be injected here -->
                    </div>
                    <div id="lang-menu">
                        <!-- Language selector will be injected here -->
                    </div>
                </div>
            </div>
        </header>

        <main id="main-content">
            <div id="view-container">
                <!-- SPA views will be injected here -->
                <div class="loader-container">
                    <div class="loader"></div>
                </div>
            </div>
        </main>
    </div>

    <!-- Firebase SDKs -->
    <script type="module" src="main.js"></script>
</body>
</html>
